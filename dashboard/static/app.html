<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Dashboard</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07090f;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
      --accent:  #6366f1;
      --adim:    rgba(99,102,241,0.14);
      --text:    #dde3ed;
      --muted:   #5e6a7e;
      --green:   #22c55e;
      --gdim:    rgba(34,197,94,0.14);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,0.95);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── FOOTER ── */
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:rgba(7,9,15,0.95); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send { background: var(--accent); color: #fff; }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── QUICK-REPLY CHIPS ── */
    .chips { display:flex; gap:6px; padding:6px 16px; flex-wrap:wrap; flex-shrink:0; }
    .chip {
      background: var(--surface); border:1px solid var(--border); color:var(--muted);
      font-size:9px; font-weight:700; letter-spacing:1.5px; padding:4px 11px;
      border-radius:99px; cursor:pointer; transition:all 0.15s; font-family:inherit;
    }
    .chip:hover { color:var(--accent); border-color:rgba(99,102,241,0.4); background:var(--adim); }
    .chip:active { transform:scale(0.95); }

    /* ── MESSAGE TIMESTAMP ── */
    .ts { font-size:9px; opacity:0.45; letter-spacing:0.5px; margin-top:3px; }
    .msg-j .ts { text-align:left; }
    .msg-u .ts { text-align:right; }

    /* ── IMAGE PREVIEW IN MESSAGES ── */
    .msg img {
      max-width: 100%;
      border-radius: 8px;
      margin: 4px 0;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .msg img:hover {
      transform: scale(1.02);
    }
    .fc-preview img {
      max-width: 100%;
      max-height: 120px;
      border-radius: 8px;
      margin-top: 8px;
      object-fit: cover;
    }

    /* ── TYPING INDICATOR ── */
    .typing { display:flex; align-items:center; gap:4px; padding:12px 14px; }
    .t-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); animation:tdot 1.2s ease-in-out infinite; }
    .t-dot:nth-child(2) { animation-delay:0.15s; }
    .t-dot:nth-child(3) { animation-delay:0.3s; }
    @keyframes tdot { 0%,100%{opacity:0.25;transform:translateY(0)} 50%{opacity:1;transform:translateY(-3px)} }

    /* ── EMPTY STATE ── */
    .empty {
      margin:auto; max-width:340px; text-align:center; padding:34px 26px; border-radius:16px;
      background:var(--surface); border:1px dashed var(--border); color:var(--muted);
      display:flex; flex-direction:column; gap:10px; align-items:center;
    }
    .empty .big { font-size:34px; color:var(--accent); }
    .empty h3 { font-size:14px; font-weight:700; color:var(--text); letter-spacing:0.5px; }
    .empty p { font-size:12px; line-height:1.6; }
    .empty .kbd { font-family:monospace; font-size:10px; background:rgba(255,255,255,0.07); padding:2px 7px; border-radius:4px; color:var(--accent); }

    /* ── SCROLL-TO-BOTTOM FAB ── */
    #fab {
      position:fixed; right:16px; bottom:86px; width:34px; height:34px; border-radius:50%;
      background:var(--adim); border:1px solid rgba(99,102,241,0.4); color:var(--accent);
      font-size:15px; cursor:pointer; display:none; align-items:center; justify-content:center;
      transition:opacity 0.2s, transform 0.15s; z-index:5; backdrop-filter:blur(6px);
    }
    #fab:hover { transform:scale(1.08); }
    #fab.show { display:flex; }

    /* ── HEADER ACTION BUTTON ── */
    .hbtn {
      background:transparent; border:1px solid var(--border); color:var(--muted);
      border-radius:8px; padding:6px 10px; font-size:10px; font-weight:700; letter-spacing:1px;
      cursor:pointer; transition:all 0.15s; font-family:inherit;
    }
    .hbtn:hover { color:var(--text); border-color:var(--accent); }
    .hbtn:active { transform:scale(0.95); }

    /* ── CAPABILITY CARD ── */
    .caps {
      align-self:center; width:min(92%, 520px);
      background:var(--adim); border:1px solid rgba(99,102,241,0.22); border-radius:14px;
      padding:16px 18px; font-size:13px; line-height:1.75; animation:pop 0.18s ease;
    }
    .caps h4 { font-size:11px; font-weight:800; letter-spacing:2px; color:#818cf8; margin-bottom:8px; }
    .caps ul { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:3px; color:#8899aa; }
    .caps li b { color:var(--text); }

    /* ── GALLERY MODAL ── */
    #gallery-modal {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(7,9,15,0.95); z-index:100;
      display:none; flex-direction:column;
    }
    #gallery-modal.show { display:flex; }
    .gallery-header {
      display:flex; align-items:center; gap:10px;
      padding:12px 16px; border-bottom:1px solid var(--border);
      background:rgba(7,9,15,0.95);
    }
    .gallery-header h3 {
      font-size:14px; font-weight:700; color:var(--text); letter-spacing:1px;
      margin:0; flex:1;
    }
    .gallery-close {
      background:transparent; border:1px solid var(--border); color:var(--muted);
      border-radius:8px; padding:6px 10px; font-size:10px; font-weight:700; letter-spacing:1px;
      cursor:pointer; transition:all 0.15s; font-family:inherit;
    }
    .gallery-close:hover { color:var(--text); border-color:var(--accent); }
    .gallery-content {
      flex:1; overflow-y:auto; padding:16px;
      display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
      gap:12px; align-content:start;
    }
    .gallery-item {
      background:var(--surface); border:1px solid var(--border);
      border-radius:12px; overflow:hidden; cursor:pointer;
      transition:all 0.2s; animation:pop 0.18s ease;
    }
    .gallery-item:hover {
      border-color:var(--accent); transform:translateY(-2px);
      box-shadow:0 4px 12px rgba(99,102,241,0.2);
    }
    .gallery-item img {
      width:100%; height:150px; object-fit:cover; display:block;
    }
    .gallery-item-info {
      padding:8px 10px; font-size:11px;
    }
    .gallery-item-name {
      color:var(--text); font-weight:600; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; margin-bottom:2px;
    }
    .gallery-item-size { color:var(--muted); font-size:10px; }
    .gallery-empty {
      grid-column:1/-1; text-align:center; padding:40px 20px;
      color:var(--muted); font-size:13px;
    }
    .gallery-loading {
      grid-column:1/-1; text-align:center; padding:40px 20px;
      color:var(--accent); font-size:13px;
    }

    /* ── STATS MODAL ── */
    #stats-modal {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(7,9,15,0.95); z-index:100;
      display:none; flex-direction:column;
    }
    #stats-modal.show { display:flex; }
    .stats-tabs { display:flex; gap:6px; flex:1; justify-content:center; }
    .stats-tab {
      background:transparent; border:1px solid var(--border); color:var(--muted);
      border-radius:8px; padding:6px 12px; font-size:10px; font-weight:700; letter-spacing:1px;
      cursor:pointer; transition:all 0.15s; font-family:inherit;
    }
    .stats-tab:hover { color:var(--text); border-color:var(--accent); }
    .stats-tab.active { background:var(--adim); border-color:rgba(99,102,241,0.45); color:#a5b4fc; }
    .stats-content {
      flex:1; overflow-y:auto; padding:16px;
      display:flex; flex-direction:column; gap:12px;
    }
    .stats-content::-webkit-scrollbar { width:3px; }
    .stats-content::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

    .srow { display:grid; grid-template-columns:repeat(auto-fit, minmax(118px, 1fr)); gap:10px; }
    .scard {
      background:var(--surface); border:1px solid var(--border); border-radius:12px;
      padding:12px 14px; animation:pop 0.18s ease;
    }
    .scard .slbl { font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
    .scard .sval { font-size:22px; font-weight:800; color:var(--text); margin-top:4px; white-space:nowrap; }
    .scard .sval em { font-style:normal; color:var(--accent); }
    .scard .sval small { font-size:11px; color:var(--muted); font-weight:700; }
    .scard.warn .sval { color:#f87171; }

    .spanel { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
    .spanel h4 { font-size:10px; font-weight:800; letter-spacing:2px; color:#818cf8; margin-bottom:8px; text-transform:uppercase; }

    .hrow { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
    .hrow:last-child { border-bottom:none; }
    .hmark { width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0; }
    .hmark.ok { background:var(--gdim); color:var(--green); }
    .hmark.no { background:var(--surface); border:1px solid var(--border); color:var(--muted); }
    .hname { flex:1; font-size:13px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .hbadge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:99px; background:var(--adim); color:#a5b4fc; flex-shrink:0; }
    .hbar { flex:0 0 84px; height:4px; border-radius:2px; background:var(--border); overflow:hidden; }
    .hbar i { display:block; height:100%; background:linear-gradient(90deg,#6366f1,#818cf8); border-radius:2px; transition:width 0.4s ease; }

    .crow { display:flex; align-items:center; gap:10px; padding:6px 0; }
    .crow .cname { flex:0 0 104px; font-size:12px; color:var(--muted); text-transform:capitalize; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .crow .cbar { flex:1; height:8px; border-radius:4px; background:var(--border); overflow:hidden; }
    .crow .cbar i { display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,#6366f1,#22c55e); transition:width 0.4s ease; }
    .crow .camt { flex:0 0 78px; text-align:right; font-size:12px; font-weight:700; color:var(--text); font-family:monospace; }
    .crow .camt.red { color:#f87171; }

    .erow { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:12px; }
    .erow:last-child { border-bottom:none; }
    .erow .edate { flex:0 0 52px; color:var(--muted); font-family:monospace; font-size:10px; }
    .erow .edesc { flex:1; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .erow .ecat { font-size:9px; font-weight:700; letter-spacing:1px; padding:2px 7px; border-radius:99px; background:var(--surface); border:1px solid var(--border); color:var(--muted); text-transform:uppercase; flex-shrink:0; }
    .erow .eamt { flex:0 0 auto; font-weight:800; color:var(--green); font-family:monospace; }
    .erow .eamt.kgs { color:#a5b4fc; }

    .exgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; }
    .excard { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
    .excard .exname { font-size:13px; font-weight:700; color:var(--text); }
    .excard .exmeta { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.7; }
    .excard .exmeta b { color:#a5b4fc; font-weight:700; }
    .excard .pr {
      margin-top:8px; font-size:9px; font-weight:700; letter-spacing:1px; color:var(--green);
      background:var(--gdim); border:1px solid rgba(34,197,94,0.3); border-radius:99px;
      display:inline-block; padding:2px 8px;
    }

    .stats-empty { text-align:center; padding:34px 20px; color:var(--muted); font-size:13px; line-height:1.8; }
    .stats-empty b { color:var(--text); }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:6px;">
        <circle cx="12" cy="12" r="10" stroke="#6366f1" stroke-width="2"/>
        <path d="M12 6L12 18M6 12L18 12" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="4" fill="#6366f1"/>
      </svg>
      <em>J</em>ARVIS
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
    <button class="hbtn" id="stats-btn" title="View habits, expenses & workout stats">📊 STATS</button>
    <button class="hbtn" id="gallery-btn" title="Image Gallery">🖼️ GALLERY</button>
    <button class="hbtn" id="clear-btn" title="Clear chat">CLEAR</button>
  </header>
  <div class="chips" id="chips">
    <button class="chip" data-cmd="open ">OPEN</button>
    <button class="chip" data-cmd="search the web for ">SEARCH</button>
    <button class="chip" data-cmd="set a reminder ">REMIND</button>
    <button class="chip" data-cmd="what's the weather today?">WEATHER</button>
    <button class="chip" data-cmd="generate an image of ">IMAGE</button>
    <button class="chip" data-cmd="__stats__">📊 STATS</button>
    <button class="chip" data-cmd="__caps__">HELP</button>
  </div>
  <main id="feed"></main>
  <footer>
    <input id="inp" placeholder="Send a command to JARVIS…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <button id="fab" title="Jump to latest">⬇</button>

  <!-- Gallery Modal -->
  <div id="gallery-modal">
    <div class="gallery-header">
      <h3>🖼️ IMAGE GALLERY</h3>
      <button class="gallery-close" id="gallery-close">CLOSE</button>
    </div>
    <div class="gallery-content" id="gallery-content">
      <div class="gallery-loading">Loading images...</div>
    </div>
  </div>

  <!-- Stats Modal -->
  <div id="stats-modal">
    <div class="gallery-header">
      <h3>📊 MY STATS</h3>
      <div class="stats-tabs">
        <button class="stats-tab active" data-tab="habits">HABITS</button>
        <button class="stats-tab" data-tab="expenses">EXPENSES</button>
        <button class="stats-tab" data-tab="workouts">WORKOUTS</button>
      </div>
      <button class="gallery-close" id="stats-close">CLOSE</button>
    </div>
    <div class="stats-content" id="stats-content">
      <div class="gallery-loading">Loading stats…</div>
    </div>
  </div>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to JARVIS'); };
    ws.onclose   = () => { _hideTyping(); sys('Connection lost — refresh to reconnect.'); };
    ws.onerror   = () => { _hideTyping(); sys('Connection error.'); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log') { if (m.speaker === 'jarvis') _hideTyping(); append(m.speaker, m.text); }
      if (m.type === 'status') { _hideTyping(); setStatus(m.state); }
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      const ts = `<div class="ts">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>`;
      
      // Parse markdown images and URLs to images
      let processedText = esc(text);
      
      // Markdown image syntax: ![alt](url)
      processedText = processedText.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;margin:4px 0;">');
      
      // Direct image URLs (jpg, jpeg, png, gif, webp) - improved regex
      processedText = processedText.replace(/(https?:\/\/[^\s"'<>]+\.(jpg|jpeg|png|gif|webp)(?:\?[^\s"'<]*)?)(?!\w)/gi, '<img src="$1" alt="Image" style="max-width:100%;border-radius:8px;margin:4px 0;">');
      
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Jarvis</div>${processedText}${ts}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${processedText}${ts}`;
      }
      _removeEmpty();
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      _removeEmpty();
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _isImage(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      return ['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext);
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;

      // Add image preview for image files
      let previewHtml = '';
      if (_isImage(file.name) && file.size < 10 * 1024 * 1024) { // < 10MB
        const reader = new FileReader();
        reader.onload = (e) => {
          const previewEl = card.querySelector('.fc-preview');
          if (previewEl) {
            previewEl.innerHTML = `<img src="${e.target.result}" alt="Preview" style="max-width:100%;max-height:120px;border-radius:8px;margin-top:8px;">`;
          }
        };
        reader.readAsDataURL(file);
        previewHtml = '<div class="fc-preview" style="text-align:center;"></div>';
      }

      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          ${previewHtml}
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';

      // Add image preview for received image files
      let previewHtml = '';
      if (_isImage(m.name) && m.size < 10 * 1024 * 1024) {
        previewHtml = `<div class="fc-preview" style="text-align:center;"><img src="${dlUrl}" alt="Preview" style="max-width:100%;max-height:120px;border-radius:8px;margin-top:8px;"></div>`;
      }

      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          ${previewHtml}
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on computer!');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      _pushHist(txt);
      append('user', txt);
      _showTyping();
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sending wake signal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); _navHist(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); _navHist(1); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Command history (localStorage, ↑/↓ navigation) ───────────────────────
    const _MAX_HIST = 50;
    let _hist = [];
    try { _hist = JSON.parse(localStorage.getItem('jarvis_hist') || '[]'); }
    catch (_) { _hist = []; }
    let _hi = _hist.length;
    let _draft = '';

    function _pushHist(cmd) {
      _hist = _hist.filter(c => c !== cmd);
      _hist.push(cmd);
      if (_hist.length > _MAX_HIST) _hist = _hist.slice(-_MAX_HIST);
      _hi = _hist.length;
      try { localStorage.setItem('jarvis_hist', JSON.stringify(_hist)); } catch (_) {}
    }

    function _navHist(dir) {
      const inp = document.getElementById('inp');
      if (!_hist.length) return;
      if (_hi === _hist.length) _draft = inp.value;        // first press — save draft
      _hi = Math.max(0, Math.min(_hist.length, _hi + dir));
      if (_hi === _hist.length) inp.value = _draft;        // past the top — restore draft
      else inp.value = _hist[_hi];
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }

    // ── Quick-reply chips ─────────────────────────────────────────────────────
    document.getElementById('chips').addEventListener('click', e => {
      const b = e.target.closest('.chip');
      if (!b) return;
      const cmd = b.dataset.cmd;
      if (cmd === '__caps__')  { _capsCard(); return; }
      if (cmd === '__stats__') { _openStats(); return; }
      const inp = document.getElementById('inp');
      inp.value = cmd;
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    });

    function _capsCard() {
      const old = document.getElementById('caps-card');
      if (old) old.remove();
      _removeEmpty();
      const c = document.createElement('div');
      c.className = 'caps'; c.id = 'caps-card';
      c.innerHTML =
        '<h4>WHAT CAN JARVIS DO?</h4><ul>' +
        '<li><b>Open apps</b> — "open spotify", "open settings"</li>' +
        '<li><b>Web search</b> — "search the web for …"</li>' +
        '<li><b>Weather</b> — "what\'s the weather today?"</li>' +
        '<li><b>Reminders</b> — "set a reminder in 10 minutes to …"</li>' +
        '<li><b>Files</b> — tap 📎 to send one to the computer</li>' +
        '<li><b>Voice</b> — tap 🎤 for hands-free talk</li>' +
        '<li><b>System</b> — "cpu usage", "battery", "volume up"</li>' +
        '</ul>';
      feed.appendChild(c);
      feed.scrollTop = feed.scrollHeight;
    }

    // ── Typing indicator ──────────────────────────────────────────────────────
    let _typingEl = null;
    let _typingTmr = null;
    function _showTyping() {
      if (_typingEl) return;
      _removeEmpty();
      _typingEl = document.createElement('div');
      _typingEl.className = 'msg msg-j typing';
      _typingEl.innerHTML = '<div class="lbl">Jarvis</div><span class="t-dot"></span><span class="t-dot"></span><span class="t-dot"></span>';
      feed.appendChild(_typingEl);
      feed.scrollTop = feed.scrollHeight;
      // Safety net — never leave the indicator stuck if no reply ever comes.
      clearTimeout(_typingTmr);
      _typingTmr = setTimeout(_hideTyping, 30000);
    }
    function _hideTyping() {
      clearTimeout(_typingTmr);
      if (_typingEl) { _typingEl.remove(); _typingEl = null; }
    }

    // ── Empty state + clear chat ─────────────────────────────────────────────
    function _maybeEmpty() {
      if (feed.children.length) return;
      const c = document.createElement('div');
      c.className = 'empty'; c.id = 'empty-card';
      c.innerHTML =
        '<div style="margin-bottom:10px;">' +
        '<svg width="64" height="64" viewBox="0 0 64 64" fill="none">' +
        '<circle cx="32" cy="32" r="28" stroke="#6366f1" stroke-width="3" opacity="0.3"/>' +
        '<circle cx="32" cy="32" r="20" stroke="#6366f1" stroke-width="2" opacity="0.5"/>' +
        '<circle cx="32" cy="32" r="12" fill="#6366f1" opacity="0.8"/>' +
        '<path d="M32 16V48M16 32H48" stroke="#fff" stroke-width="2" stroke-linecap="round"/>' +
        '</svg>' +
        '</div>' +
        '<h3>JARVIS — remote control</h3>' +
        '<p>Standing by on your computer.<br>Type a command, tap a quick chip below, or try the <span class="kbd">🎤</span> voice button.</p>' +
        '<p style="font-size:10px;opacity:0.7">Traffic is end-to-end AES-256 encrypted.</p>';
      feed.appendChild(c);
      feed.scrollTop = feed.scrollHeight;
    }
    function _removeEmpty() {
      const c = document.getElementById('empty-card');
      if (c) c.remove();
    }

    function _clearChat() {
      _hideTyping();
      feed.innerHTML = '';
      _maybeEmpty();
      toast('Chat cleared');
    }
    document.getElementById('clear-btn').addEventListener('click', _clearChat);

    // ── Scroll-to-bottom FAB ──────────────────────────────────────────────────
    const fab = document.getElementById('fab');
    feed.addEventListener('scroll', () => {
      const near = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 90;
      fab.classList.toggle('show', !near && feed.children.length > 0);
    });
    fab.addEventListener('click', () => { feed.scrollTop = feed.scrollHeight; fab.classList.remove('show'); });

    _maybeEmpty();

    // ── Gallery Functions ──────────────────────────────────────────────────────
    const galleryModal = document.getElementById('gallery-modal');
    const galleryContent = document.getElementById('gallery-content');
    const galleryClose = document.getElementById('gallery-close');
    const galleryBtn = document.getElementById('gallery-btn');

    function _openGallery() {
      galleryModal.classList.add('show');
      _loadGallery();
    }

    function _closeGallery() {
      galleryModal.classList.remove('show');
    }

    async function _loadGallery() {
      galleryContent.innerHTML = '<div class="gallery-loading">Loading images...</div>';
      
      try {
        const response = await _authFetch('/api/gallery');
        const data = await response.json();
        
        if (!data.images || data.images.length === 0) {
          galleryContent.innerHTML = '<div class="gallery-empty">No generated images yet.<br>Try saying "generate an image of..."</div>';
          return;
        }
        
        galleryContent.innerHTML = '';
        data.images.forEach(img => {
          const item = document.createElement('div');
          item.className = 'gallery-item';
          item.innerHTML = `
            <img src="${img.url}" alt="${img.name}" loading="lazy">
            <div class="gallery-item-info">
              <div class="gallery-item-name">${img.name}</div>
              <div class="gallery-item-size">${_fmtSize(img.size)}</div>
            </div>
          `;
          item.addEventListener('click', () => {
            window.open(img.url, '_blank');
          });
          galleryContent.appendChild(item);
        });
      } catch (error) {
        galleryContent.innerHTML = '<div class="gallery-empty">Failed to load images.<br>Please try again.</div>';
      }
    }

    galleryBtn.addEventListener('click', _openGallery);
    galleryClose.addEventListener('click', _closeGallery);
    galleryModal.addEventListener('click', (e) => {
      if (e.target === galleryModal) _closeGallery();
    });

    // ── Stats — plugin data (habits / expenses / workouts) ────────────────────
    const statsModal   = document.getElementById('stats-modal');
    const statsContent = document.getElementById('stats-content');
    const statsClose   = document.getElementById('stats-close');
    const statsBtn     = document.getElementById('stats-btn');
    let _statsData = null;
    let _statsTab  = 'habits';

    function _openStats()  { statsModal.classList.add('show'); _loadStats(); }
    function _closeStats() { statsModal.classList.remove('show'); }

    async function _loadStats() {
      statsContent.innerHTML = '<div class="gallery-loading">Loading stats…</div>';
      try {
        const r = await _authFetch('/api/stats');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        _statsData = await r.json();
        _renderStats();
      } catch {
        statsContent.innerHTML = '<div class="stats-empty">Could not load stats.<br>Make sure the JARVIS app is running.</div>';
      }
    }

    function _renderStats() {
      if (!_statsData) return;
      if (_statsTab === 'habits')    _renderHabits(_statsData.habits || {});
      else if (_statsTab === 'expenses') _renderExpenses(_statsData.expenses || {});
      else _renderWorkouts(_statsData.workouts || {});
    }

    function _renderHabits(h) {
      const rows = h.habits || [];
      if (!rows.length) {
        statsContent.innerHTML = '<div class="stats-empty">No habits tracked yet.<br>In chat, say <b>"add a habit: drink water"</b> to get started.</div>';
        return;
      }
      const max = Math.max(...rows.map(r => r.total), 1);
      const best = Math.max(...rows.map(r => r.streak), 0);
      statsContent.innerHTML =
        `<div class="srow">
           <div class="scard"><div class="slbl">Habits</div><div class="sval"><em>${rows.length}</em></div></div>
           <div class="scard"><div class="slbl">Done today</div><div class="sval"><em>${h.done_today || 0}</em></div></div>
           <div class="scard"><div class="slbl">Best streak</div><div class="sval"><em>${best}</em><small> days</small></div></div>
         </div>
         <div class="spanel"><h4>Current streaks</h4>` +
        rows.map(r => `
           <div class="hrow">
             <span class="hmark ${r.done_today ? 'ok' : 'no'}">${r.done_today ? '✓' : '·'}</span>
             <div class="hname">${esc(r.name)}</div>
             <div class="hbar" title="${r.total} total log(s)"><i style="width:${Math.max(4, Math.round(r.total / max * 100))}%"></i></div>
             <span class="hbadge">🔥 ${r.streak}d</span>
           </div>`).join('') +
        '</div>';
    }

    function _renderExpenses(e) {
      const cats   = e.by_category || [];
      const recent = e.recent || [];
      const max    = Math.max(...cats.map(c => c.amount), 1);
      const month  = esc(e.month || '');

      let budgetCard = '';
      if (e.budget != null) {
        const over = (e.budget_left || 0) < 0;
        const pct  = Math.min(100, Math.round(((e.total || 0) / e.budget) * 100));
        budgetCard =
          `<div class="spanel"><h4>Budget · ${month}</h4>
             <div class="crow">
               <span class="cname">Spent</span>
               <div class="cbar"><i style="width:${pct}%;${over ? 'background:linear-gradient(90deg,#ef4444,#f87171)' : ''}"></i></div>
               <span class="camt ${over ? 'red' : ''}">$${(e.total || 0).toFixed(2)} / $${e.budget.toFixed(2)}</span>
             </div>
             <div style="font-size:11px;font-weight:700;margin-top:6px;color:${over ? '#f87171' : 'var(--green)'}">
               ${over ? '⚠ ' + Math.abs(e.budget_left).toFixed(2) + ' over budget' : 'Budget left: $' + e.budget_left.toFixed(2)}
             </div>
           </div>`;
      }

      const catBars = cats.length ?
        cats.map(c => `
           <div class="crow">
             <span class="cname">${esc(c.cat)}</span>
             <div class="cbar"><i style="width:${Math.max(3, Math.round(c.amount / max * 100))}%"></i></div>
             <span class="camt">$${c.amount.toFixed(2)}</span>
           </div>`).join('') :
        `<div class="stats-empty">No spending in ${month} yet.<br>In chat, say <b>"spent 25 on lunch"</b>.</div>`;

      const recentRows = recent.length ?
        recent.map(r => `
           <div class="erow">
             <span class="edate">${esc((r.date || '').slice(5))}</span>
             <span class="edesc">${esc(r.desc)}</span>
             <span class="ecat">${esc(r.cat)}</span>
             <span class="eamt">$${r.amount.toFixed(2)}</span>
           </div>`).join('') :
        '<div class="stats-empty">No recent expenses.</div>';

      statsContent.innerHTML =
        `<div class="srow">
           <div class="scard"><div class="slbl">This month</div><div class="sval"><em>$${(e.total || 0).toFixed(2)}</em></div></div>
           <div class="scard"><div class="slbl">Entries</div><div class="sval"><em>${e.count || 0}</em></div></div>
           <div class="scard"><div class="slbl">Last 7 days</div><div class="sval"><em>$${(e.week_total || 0).toFixed(2)}</em></div></div>
         </div>
         ${budgetCard}
         <div class="spanel"><h4>By category · ${month}</h4>${catBars}</div>
         <div class="spanel"><h4>Recent</h4>${recentRows}</div>`;
    }

    function _renderWorkouts(w) {
      const ex     = w.by_exercise || [];
      const recent = w.recent || [];

      const exCards = ex.length ?
        ex.map(x => `
           <div class="excard">
             <div class="exname">${esc(x.exercise)}</div>
             <div class="exmeta">
               Sets <b>${x.sets}</b> · Reps <b>${x.reps_total}</b><br>
               Volume <b>${(x.volume || 0).toLocaleString()} kg</b>
               ${x.pr_weight ? `<br>PR <b>${x.pr_weight} kg</b>` : ''}
             </div>
             ${x.pr_weight ? `<span class="pr">🏆 ${esc(x.pr_date || '')}</span>` : ''}
           </div>`).join('') :
        '<div class="stats-empty">No workouts logged yet.<br>In chat, say <b>"log 3 sets of 5 bench press at 100 kilos"</b>.</div>';

      const recentRows = recent.length ?
        recent.map(r => `
           <div class="erow">
             <span class="edate">${esc((r.date || '').slice(5))}</span>
             <span class="edesc">${esc(r.exercise)}</span>
             <span class="ecat">${r.sets}x${r.reps}</span>
             <span class="eamt kgs">${r.weight ? r.weight + ' kg' : '—'}</span>
           </div>`).join('') : '';

      statsContent.innerHTML =
        `<div class="srow">
           <div class="scard"><div class="slbl">Days · 7d</div><div class="sval"><em>${w.week_days || 0}</em></div></div>
           <div class="scard"><div class="slbl">Sets · 7d</div><div class="sval"><em>${w.week_sets || 0}</em></div></div>
           <div class="scard"><div class="slbl">Volume · 7d</div><div class="sval"><em>${(w.week_volume || 0).toLocaleString()}</em><small> kg</small></div></div>
           <div class="scard"><div class="slbl">All time</div><div class="sval"><em>${w.total_entries || 0}</em><small> entries</small></div></div>
         </div>
         <div class="spanel"><h4>Per exercise · all time</h4><div class="exgrid">${exCards}</div></div>
         ${recentRows ? `<div class="spanel"><h4>Recent</h4>${recentRows}</div>` : ''}`;
    }

    document.querySelectorAll('.stats-tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.stats-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        _statsTab = t.dataset.tab;
        if (_statsData) _renderStats(); else _loadStats();
      });
    });
    statsBtn.addEventListener('click', _openStats);
    statsClose.addEventListener('click', _closeStats);
    statsModal.addEventListener('click', (e) => {
      if (e.target === statsModal) _closeStats();
    });

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
</body>
